name: Release

# Push a semver tag without a "v" prefix (1.0.0, 1.2.3-beta.1) to run the tests, build x_rls_console_<tag>.zip
# and publish it as a GitHub release. Tags with a pre-release part (anything after "-") are marked as pre-releases.
on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag is semver without a v prefix
        run: |
          tag="$GITHUB_REF_NAME"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! [[ "$tag" =~ $semver ]]; then
            echo "::error::Tag '$tag' is not semver like 1.2.3 or 1.2.3-beta.1 (no v prefix)"
            exit 1
          fi

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Run tests
        run: |
          luajit tools/test_console.lua
          luajit tools/test_ui.lua

      - name: Build mod zip
        run: |
          zip_name="x_rls_console_${GITHUB_REF_NAME}.zip"
          # The mod's files sit at the root of the zip, as BeamNG expects.
          cp README.md mod/README.md
          (cd mod && zip -r "../$zip_name" .)
          unzip -l "$zip_name"
          echo "ZIP_NAME=$zip_name" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" "$ZIP_NAME" \
            --title "x_rls_console $GITHUB_REF_NAME" \
            --generate-notes $prerelease
